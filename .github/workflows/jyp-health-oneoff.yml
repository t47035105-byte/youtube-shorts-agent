name: Park Jin-young Health Short

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jyp-health-oneoff.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
      IMAGE_COUNT: "0"
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render Park Jin-young supplements Short
        run: >-
          python -m src.main
          "박진영이 방송에서 공개한 하루 영양제와 아침 섭취 루틴을 소개하는 45~55초 한국어 유튜브 쇼츠. 첫 3초 훅은 '박진영은 아침에 뭘 이렇게 챙겨 먹을까?'로 한다. 공개된 내용 중심으로 7종의 유기농 비타민·영양제, 유산균 식품 3가지인 플레인 요거트·케피어·유산균 분말, 클로렐라와 스피룰리나, 잣·해바라기씨·아몬드 등 견과류, 과일, 올리브오일을 빠르고 보기 쉽게 소개한다. 최근 공개한 식사 방식은 모든 섭취를 약 6시간 안에 마치고 나머지 약 18시간은 칼로리 섭취를 하지 않는 18:6 방식으로 설명한다. 아침에는 견과류·과일·요거트 등을 먹고 이후 점심 한 끼를 먹으며 저녁 약속이 있는 날에는 점심을 건너뛴다고 소개한다. 정확한 제품명이나 용량은 확인되지 않았으므로 만들어내지 않는다. 특정 영양제·식품의 의학적 효과를 단정하지 말고 박진영 개인이 공개한 자기관리 루틴이라는 점을 마지막에 분명히 한다. 50대 이상도 한눈에 읽도록 큰 자막과 짧은 문장을 사용한다."
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: park-jinyoung-supplements-short
          path: output/
          if-no-files-found: error
          retention-days: 7
