name: Park Jin-young Health Short

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jyp-health-oneoff.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
      IMAGE_COUNT: "0"
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render Park Jin-young supplements Short
        run: >-
          python -m src.main
          "무대를 위해 수십 년간 자신을 관리해 온 박진영. 그의 하루는 어떻게 시작될까요? 이 문장으로 시작하는 45~55초 한국어 프리미엄 다큐·매거진 스타일 쇼츠. 박진영이 방송과 인터뷰에서 공개한 자기관리 루틴을 품격 있고 빠르게 소개한다. 공개된 내용 중심으로 7종의 유기농 비타민·영양제와 클로렐라·스피룰리나, 잣·해바라기씨·아몬드 등 견과류, 과일, 올리브오일을 소개한다. 중요: 유산균 3종이라고 뭉뚱그리지 말고 반드시 '첫째 플레인 요거트, 둘째 케피어 발효유, 셋째 유산균 분말'이라고 내레이션에서 각각 이름을 말하고 화면 자막에도 '플레인 요거트 / 케피어 / 유산균 분말' 세 가지를 모두 나열한다. 최근 공개한 식사 방식은 모든 섭취를 약 6시간 안에 마치고 나머지 약 18시간은 칼로리 섭취를 하지 않는 18:6 방식으로 설명한다. 아침에는 견과류·과일·요거트 등을 먹고 이후 점심 한 끼를 먹으며 저녁 약속이 있는 날에는 점심을 건너뛴다고 소개한다. 정확한 제품명이나 용량은 확인되지 않았으므로 만들어내지 않는다. 특정 영양제·식품의 의학적 효과를 단정하지 말고 박진영 개인이 공개한 자기관리 루틴이라는 점을 마지막에 분명히 한다. 화면은 유치한 건강정보 카드가 아니라 프리미엄 K-콘텐츠 다큐처럼 한 장면에 한 메시지만 사용한다."
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: park-jinyoung-supplements-short
          path: output/
          if-no-files-found: error
          retention-days: 7
