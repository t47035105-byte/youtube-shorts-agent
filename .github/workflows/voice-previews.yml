name: Clear Korean voice previews

on:
  push:
    branches:
      - codex/render-coupang-narration
    paths:
      - .github/workflows/voice-previews.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/voice-previews.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - name: Generate three clear female voice previews
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          api_key = os.environ["ELEVENLABS_API_KEY"]
          out = pathlib.Path("voice-previews")
          out.mkdir(exist_ok=True)

          voices = [
              {"number": 1, "name": "Alice - clear and confident", "voice_id": "Xb7hH8MSUJpSbSDYk0k2"},
              {"number": 2, "name": "Laura - bright and friendly", "voice_id": "FGY2WhTYpPnrIDTdsKH5"},
              {"number": 3, "name": "Jessica - natural and lively", "voice_id": "cgSgspJ2msm6clMCkdW9"},
          ]
          sample = (
              "멤버십은 많이 쓰는 것보다, 내 생활에 맞게 고르는 것이 더 중요합니다. "
              "배달과 장보기를 자주 이용한다면 쿠팡 와우가 편리하고, "
              "쇼핑 적립과 콘텐츠 혜택을 함께 원한다면 네이버플러스가 잘 맞습니다."
          )

          generated = []
          for voice in voices:
              url = (
                  "https://api.elevenlabs.io/v1/text-to-speech/"
                  + urllib.parse.quote(voice["voice_id"], safe="")
                  + "?output_format=mp3_44100_128"
              )
              payload = {
                  "text": sample,
                  "model_id": "eleven_multilingual_v2",
                  "voice_settings": {
                      "stability": 0.5,
                      "similarity_boost": 0.68,
                      "style": 0.05,
                      "use_speaker_boost": True,
                  },
              }
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "xi-api-key": api_key,
                      "Content-Type": "application/json",
                      "Accept": "audio/mpeg",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      audio = response.read()
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  raise RuntimeError(f"{voice['name']} failed: {exc.code} {detail[:500]}") from exc
              filename = f"voice-{voice['number']}.mp3"
              (out / filename).write_bytes(audio)
              generated.append({**voice, "filename": filename})

          (out / "voices.json").write_text(
              json.dumps({"sample": sample, "voices": generated}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
      - name: Upload voice previews
        uses: actions/upload-artifact@v4
        with:
          name: clear-korean-voice-previews
          path: voice-previews/
          if-no-files-found: error
          retention-days: 7
