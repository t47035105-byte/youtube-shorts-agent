name: Telegram Shorts Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/render-coupang-narration
    paths:
      - ".github/workflows/telegram-agent.yml"
      - "src/**"
      - "scripts/setup_elevenlabs_voice.py"
      - "requirements.txt"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-shorts-agent
  cancel-in-progress: false

jobs:
  setup-elevenlabs-voice:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install voice setup runtime
        run: python -m pip install "requests>=2.32.0"
      - name: Create and configure the Shorts narrator
        run: python scripts/setup_elevenlabs_voice.py
      - name: Persist generated voice ID
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- config/elevenlabs_voice_id.txt)" ]; then exit 0; fi
          git config user.name "shorts-agent"
          git config user.email "actions@users.noreply.github.com"
          git add config/elevenlabs_voice_id.txt
          git commit -m "chore: configure ElevenLabs Shorts voice"
          git push
      - name: Upload voice preview
        uses: actions/upload-artifact@v4
        with:
          name: jenny-korean-shorts-voice-preview
          path: output/voice-preview-jenny-korean-shorts.mp3
          if-no-files-found: ignore
          retention-days: 7

  poll-and-produce:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
      IMAGE_COUNT: ${{ vars.IMAGE_COUNT || '4' }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
      TELEGRAM_ALLOWED_USERNAME: ${{ secrets.TELEGRAM_ALLOWED_USERNAME }}
      MAX_JOBS_PER_RUN: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Poll Telegram and produce
        run: python -m src.telegram_agent
      - name: Persist Telegram offset
        if: always()
        run: |
          if git diff --quiet -- state/telegram_offset.txt; then exit 0; fi
          git config user.name "shorts-agent"
          git config user.email "actions@users.noreply.github.com"
          git add state/telegram_offset.txt
          git commit -m "chore: advance Telegram offset"
          git push
      - name: Upload completed videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 7
