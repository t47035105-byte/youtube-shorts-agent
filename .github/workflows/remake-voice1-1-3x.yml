name: Remake Voice 1 at 1.3x

on:
  push:
    branches:
      - codex/remake-voice1-1-3x
    paths:
      - ".github/workflows/remake-voice1-1-3x.yml"

permissions:
  contents: read

jobs:
  generate-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install "requests>=2.32.0"
      - name: Generate full narration with voice 1
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import requests

          voice_id = "Xb7hH8MSUJpSbSDYk0k2"
          narration = (
              "쿠팡 와우와 네이버플러스, 둘 다 내면 한 달 만 이천칠백구십 원. "
              "매년 십오만 삼천사백팔십 원입니다. 둘 다 정말 필요할까요? "
              "쿠팡 와우는 월 칠천팔백구십 원. 로켓배송과 무료반품을 자주 쓰는 사람에게 유리합니다. "
              "배송비를 건당 삼천 원으로 가정하면 한 달 세 번부터 회비를 넘깁니다. "
              "네이버플러스는 월 사천구백 원, 연간권은 월 환산 삼천구백 원입니다. "
              "최대 오 퍼센트 적립을 모두 받는다면 월간권은 약 구만 팔천 원, 연간권은 약 칠만 팔천 원 결제부터 본전입니다. "
              "소액 로켓배송을 자주 하면 쿠팡. 네이버 쇼핑과 디지털 콘텐츠를 함께 쓰면 네이버. "
              "둘 다 애매하면 최근 한 달 사용내역부터 확인하세요. 구독은 습관이 아니라 계산입니다."
          )
          api_key = os.environ.get("ELEVENLABS_API_KEY", "").strip()
          if not api_key:
              raise RuntimeError("ELEVENLABS_API_KEY is required")

          response = requests.post(
              f"https://api.elevenlabs.io/v1/text-to-speech/{voice_id}",
              params={"output_format": "mp3_44100_128"},
              headers={
                  "xi-api-key": api_key,
                  "Content-Type": "application/json",
                  "Accept": "audio/mpeg",
              },
              json={
                  "text": narration,
                  "model_id": "eleven_multilingual_v2",
                  "voice_settings": {
                      "stability": 0.42,
                      "similarity_boost": 0.78,
                      "style": 0.18,
                      "use_speaker_boost": True,
                  },
              },
              timeout=180,
          )
          if not response.ok:
              raise RuntimeError(
                  f"ElevenLabs TTS failed ({response.status_code}): {response.text}"
              )
          output = Path("output/voice1-full-raw.mp3")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(response.content)
          PY
      - name: Speed narration to 1.3x
        run: |
          ffmpeg -y -i output/voice1-full-raw.mp3 -filter:a "atempo=1.3" -c:a libmp3lame -b:a 192k output/voice1-full-1.3x.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/voice1-full-1.3x.mp3
      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: voice1-full-1-3x
          path: output/voice1-full-1.3x.mp3
          if-no-files-found: error
          retention-days: 7
